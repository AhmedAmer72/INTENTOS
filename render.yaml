# Render Blueprint — API only. Web is on Vercel (see docs/deploy.md).
# Dashboard → New → Blueprint → this repo. Secrets stay in the Render UI.

services:
  - type: web
    name: intentos-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: corepack enable && corepack prepare pnpm@10.28.2 --activate && pnpm install --frozen-lockfile && pnpm --filter @intentos/api db:generate && pnpm --filter @intentos/api db:push
    startCommand: pnpm --filter @intentos/api start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: API_HOST
        value: 0.0.0.0
      # Render terminates TLS one hop in front of the app. Without this the rate
      # limiter would see the proxy address for every visitor and throttle them
      # as a single client.
      - key: TRUST_PROXY
        value: "1"
      # Comma-separated browser origins allowed to spend this deploy's Router key
      # and oracle gas, e.g. https://intentos.vercel.app. Unset means any origin.
      - key: ALLOWED_ORIGINS
        sync: false
      - key: RATE_LIMIT_PER_MIN
        value: "30"
      - key: DATABASE_URL
        value: file:./prisma/prod.db
      - key: ZEROG_NETWORK
        value: mainnet
      - key: ZEROG_MAINNET_RPC
        value: https://evmrpc.0g.ai
      - key: ZEROG_STORAGE_UPLOAD
        value: "1"
      - key: ZEROG_ROUTER_MODEL
        value: qwen3.8-flash
      - key: ZEROG_ROUTER_URL_MAINNET
        value: https://router-api.0g.ai/v1
      - key: VERIFY_PRICE_WEI
        value: "100000000000000"
      - key: ZEROG_ROUTER_API_KEY
        sync: false
      - key: DEPLOYER_PRIVATE_KEY
        sync: false
      - key: VERIFIER_ORACLE_PRIVATE_KEY
        sync: false
      - key: INTENT_REGISTRY_ADDRESS
        sync: false
      - key: DEMO_VAULT_ADDRESS
        sync: false
      - key: VERIFICATION_METER_ADDRESS
        sync: false
      - key: CERTIFICATE_CONSUMER_ADDRESS
        sync: false
      - key: AGENTIC_ID_ADDRESS
        sync: false
      - key: AGENTIC_ID_TOKEN
        sync: false
      - key: INTENT_EXECUTOR_ADDRESS
        sync: false
      - key: SETTLEMENT_TARGET_ADDRESS
        sync: false
      - key: INTENT_BOUNTY_ADDRESS
        sync: false
      - key: AGENTIC_ID_V2_ADDRESS
        sync: false
      - key: AGENTIC_ID_V2_TOKEN
        sync: false
      - key: CHALLENGE_DELAY_SECONDS
        value: "900"
      - key: AGENT_ID
        sync: false
      - key: REQUIREMENT_AGENT_ID
        sync: false
